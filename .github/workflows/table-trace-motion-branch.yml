name: ConceptMotion table trace motion branch gate

on:
  push:
    branches: [conceptmotion-table-trace-motion-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: project/conceptmotion_studio
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: project/conceptmotion_studio/pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile
      - name: Table trace core grammar
        run: pnpm exec vitest run packages/core/tests/table-trace.test.ts
      - name: Table trace motion and SVG registry
        run: pnpm exec vitest run packages/svg/tests/table-trace.test.ts packages/svg/tests/table-trace-a11y.test.ts packages/svg/tests/renderers.test.ts packages/svg/tests/semantic-nodes.test.ts
      - name: Figure integration
        run: pnpm exec vitest run packages/figure/tests/registry.test.tsx packages/figure/tests/table-trace.test.tsx
      - name: JSON Sandbox gallery
        run: pnpm exec vitest run apps/studio/src/data/visualSandbox.test.ts
      - name: TypeScript project references
        run: pnpm run typecheck
      - name: Production Studio build
        run: pnpm exec vite build --config apps/studio/vite.config.ts
      - name: Bundle policy check
        run: pnpm run test:bundle
      - name: Browser and phone motion smoke
        run: pnpm exec playwright test tests/browser/table-trace-motion.spec.ts --config=playwright.table-trace-motion.config.ts
